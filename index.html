
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REGO 全齡模組化生活</title>

<style>
:root{
 --blue:#87CEEB;
 --blue-dark:#4D9DBF;
 --blue-light:#DDF3FC;
 --orange:#f29a38;
 --orange-light:#fff1df;
 --bg:#F3F8FC;
 --text:#263b4b;
 --muted:#788895;
 --white:#ffffff;
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,"Noto Sans TC",sans-serif;
 background:var(--bg);
 color:var(--text);
}

header{
 background:var(--blue);
 color:var(--text);
 padding:22px 7%;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:28px;
 font-weight:bold;
 letter-spacing:4px;
}

header small{color:#315E78}

main{
 max-width:1000px;
 margin:auto;
 padding:25px 18px 40px;
}

.page{display:none}
.page.active{display:block}

/* 標題 */
h2{
 font-size:23px;
 margin-top:10px;
}

h3{margin-bottom:8px}

.muted{
 color:var(--muted);
 font-size:14px;
 line-height:1.7;
}

/* 通用卡片 */
.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:14px;
}

.card{
 background:var(--white);
 border:1px solid #e1e9ef;
 border-radius:20px;
 padding:18px;
}

/* 圖片區域 */
.visual{
 height:105px;
 background:var(--blue-light);
 border-radius:14px;
 display:grid;
 place-items:center;
 font-size:48px;
 margin-bottom:12px;
}

/* 按鈕 */
button{
 border:0;
 border-radius:12px;
 padding:12px 18px;
 background:var(--blue);
 color:#183b56;
 font-size:15px;
 cursor:pointer;
 transition:0.2s;
}

button:hover{
 background:var(--blue-dark);
 color:white;
}

button:active{transform:scale(.97)}

button.orange{
 background:var(--orange);
 color:#263b4b;
}

button.orange:hover{
 background:#e78925;
}

/* 首頁 */
#home{
 min-height:calc(100vh - 125px);
 display:flex;
 align-items:center;
 justify-content:center;
}

#home .grid{
 width:100%;
 max-width:800px;
 margin:auto;
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:30px;
}

.age-card{
 min-height:310px;
 padding:25px 18px;
 border-radius:24px;
 cursor:pointer;
 text-align:center;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 transition:0.2s;
 box-shadow:0 5px 18px rgba(40,84,119,0.07);
}

.age-card:hover{
 transform:translateY(-6px);
 border-color:var(--orange);
 box-shadow:0 10px 24px rgba(40,84,119,0.15);
}

.age-card .visual{
 width:100%;
 height:190px;
 font-size:100px;
 margin-bottom:18px;
 border-radius:18px;
 background:var(--blue-light);
}

.age-card b{
 font-size:30px;
 color:var(--blue-dark);
}

.age-card button{
 width:85%;
 max-width:230px;
 padding:15px 18px;
 margin-top:18px;
 font-size:18px;
 font-weight:bold;
 border-radius:14px;
}

/* 產品頁 */
.back-button{
 display:inline-flex;
 align-items:center;
 gap:6px;
 margin-bottom:18px;
 background:var(--orange);
 color:#263b4b;
 font-weight:bold;
}

.back-button:hover{
 background:#e78925;
}

.actions{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:15px;
}

.stage-button{
 background:var(--blue-light);
 color:var(--blue-dark);
 padding:12px 22px;
}

.stage-button.selected{
 background:var(--orange);
 color:#263b4b;
 font-weight:bold;
}

/* 產品卡片 */
.product-card{
 text-align:center;
 transition:0.2s;
 padding:22px;
}

.product-card:hover{
 transform:translateY(-4px);
 border-color:var(--orange);
}

.product-card .visual{
 height:160px;
 font-size:85px;
 background:var(--orange-light);
 display:grid;
 place-items:center;
}

.product-card h3{
 font-size:21px;
}

.product-card .muted{
 font-size:14px;
}

.product-label{
 display:inline-block;
 background:var(--blue-light);
 color:var(--blue-dark);
 border-radius:20px;
 padding:7px 14px;
 font-size:13px;
 margin-top:8px;
}

.product-placeholder{
 border:1px dashed #e7a65c;
 background:#fffaf3;
}

/* 電腦版 */
@media(min-width:700px){
 #home .grid{
  max-width:800px;
  gap:30px;
 }

 #home .age-card{
  min-height:310px;
 }
}

/* 手機版 */
@media(max-width:480px){
 header{
  padding:18px 20px;
 }

 header small{
  font-size:10px;
 }

 main{
  padding:20px 14px 30px;
 }

 #home{
  min-height:calc(100vh - 100px);
 }

 #home .grid{
  gap:14px;
 }

 #home .age-card{
  min-height:210px;
  padding:14px 10px;
  border-radius:18px;
 }

 #home .age-card .visual{
  height:125px;
  font-size:68px;
  margin-bottom:12px;
 }

 #home .age-card b{
  font-size:23px;
 }

 #home .age-card button{
  width:95%;
  padding:11px 5px;
  font-size:14px;
  margin-top:12px;
 }

 .product-card .visual{
  height:115px;
  font-size:65px;
 }

 .product-card{
  padding:14px;
 }
}
</style>
</head>

<body>

<header>
 <div class="logo">REGO</div>
 <small>GROW WITH EVERY STAGE.</small>
</header>

<main>

<!-- 首頁 -->
<section class="page active" id="home">

 <div class="grid">

  <div class="card age-card" onclick="openAge('兒童')">
   <div class="visual">🧸</div>
   <b>兒童</b>
   <button class="orange">查看產品 →</button>
  </div>

  <div class="card age-card" onclick="openAge('青年')">
   <div class="visual">🚲</div>
   <b>青年</b>
   <button class="orange">查看產品 →</button>
  </div>

  <div class="card age-card" onclick="openAge('壯年')">
   <div class="visual">🛒</div>
   <b>壯年</b>
   <button class="orange">查看產品 →</button>
  </div>

  <div class="card age-card" onclick="openAge('老年')">
   <div class="visual">🚶</div>
   <b>老年</b>
   <button class="orange">查看產品 →</button>
  </div>

 </div>
</section>


<!-- 產品頁 -->
<section class="page" id="products">

 <button class="back-button" onclick="showPage('home')">
  ← 返回首頁
 </button>

 <h2>產品 Products</h2>
 <p class="muted">選擇年齡階段，查看不同時期適合的產品。</p>

 <div class="actions">
  <button class="stage-button selected" id="btn-兒童"
   onclick="showProducts('兒童')">兒童</button>

  <button class="stage-button" id="btn-青年"
   onclick="showProducts('青年')">青年</button>

  <button class="stage-button" id="btn-壯年"
   onclick="showProducts('壯年')">壯年</button>

  <button class="stage-button" id="btn-老年"
   onclick="showProducts('老年')">老年</button>
 </div>

 <div style="margin-top:25px">
  <h3 id="stageTitle">兒童階段</h3>
  <p class="muted" id="stageDesc">
   透過遊戲與移動，陪伴孩子探索世界。
  </p>

  <div class="grid" id="productList"></div>
 </div>

</section>

</main>


<script>

// 四個年齡階段產品資料
const products={

 '兒童':{
  desc:'透過遊戲與移動，陪伴孩子探索世界。',
  items:[
   {
    icon:'🧸',
    name:'搖搖馬',
    desc:'透過搖擺與遊戲，帶來有趣的體驗。'
   },
   {
    icon:'🛴',
    name:'滑步車',
    desc:'透過雙腳滑行，練習平衡與移動。'
   },
   {
    icon:'✨',
    name:'第三項產品',
    desc:'新產品正在規劃中，敬請期待。',
    placeholder:true
   }
  ]
 },

 '青年':{
  desc:'提供自由移動與日常活動的使用體驗。',
  items:[
   {
    icon:'🚲',
    name:'腳踏車',
    desc:'適合日常移動與休閒活動。'
   },
   {
    icon:'🛴',
    name:'滑板車',
    desc:'輕巧方便，讓移動更加自由。'
   }
  ]
 },

 '壯年':{
  desc:'配合生活需求，讓日常移動更加便利。',
  items:[
   {
    icon:'🛒',
    name:'折疊推車',
    desc:'協助日常物品搬運，並可依需求收納。'
   }
  ]
 },

 '老年':{
  desc:'提供生活移動上的支持與陪伴。',
  items:[
   {
    icon:'🛒',
    name:'買菜車',
    desc:'方便日常採買與物品攜帶。'
   },
   {
    icon:'🚶',
    name:'助行器',
    desc:'提供日常行走時的輔助與支持。'
   }
  ]
 }

};


// 頁面切換
function showPage(id){

 document.querySelectorAll('.page').forEach(page=>{
  page.classList.remove('active');
 });

 document.getElementById(id).classList.add('active');

 window.scrollTo(0,0);
}


// 點擊首頁年齡卡片
function openAge(age){
 showProducts(age);
 showPage('products');
}


// 切換產品內容
function showProducts(age){

 const data=products[age];

 document.getElementById('stageTitle').textContent=
  age+'階段';

 document.getElementById('stageDesc').textContent=
  data.desc;

 // 更新年齡按鈕
 document.querySelectorAll('.stage-button').forEach(btn=>{
  btn.classList.remove('selected');
 });

 document.getElementById('btn-'+age).classList.add('selected');

 // 顯示產品卡片
 const list=document.getElementById('productList');

 list.innerHTML='';

 data.items.forEach(item=>{

  const card=document.createElement('div');
  card.className='card product-card';

  if(item.placeholder){
   card.classList.add('product-placeholder');
  }

  const visual=document.createElement('div');
  visual.className='visual';
  visual.textContent=item.icon;

  const title=document.createElement('h3');
  title.textContent=item.name;

  const desc=document.createElement('p');
  desc.className='muted';
  desc.textContent=item.desc;

  const label=document.createElement('span');
  label.className='product-label';
  label.textContent=item.placeholder
   ?'規劃中'
   :'REGO 產品';

  card.appendChild(visual);
  card.appendChild(title);
  card.appendChild(desc);
  card.appendChild(label);

  list.appendChild(card);

 });

}


// 預設顯示兒童產品資料
showProducts('兒童');

</script>

</body>
</html>
