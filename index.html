
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REGO 全齡模組化生活</title>

<style>
* { box-sizing: border-box; }

:root {
  --blue:#87CEEB;
  --blue-dark:#4D9DBF;
  --blue-light:#DDF3FC;
  --orange:#f29a38;
  --orange-light:#fff1df;
  --bg:#F3F8FC;
  --text:#263b4b;
  --muted:#788895;
  --white:#ffffff;
}

body {
  margin:0;
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:var(--bg);
  color:var(--text);
}

header {
  background:var(--blue);
  color:white;
  text-align:center;
  padding:18px;
}

.logo {
  font-size:30px;
  font-weight:900;
  letter-spacing:3px;
}

.tagline {
  font-size:13px;
  margin-top:4px;
}

.page {
  display:none;
  min-height:calc(100vh - 90px);
  padding:20px;
}

.page.active { display:block; }

.home-title {
  text-align:center;
  font-size:20px;
  margin:10px 0 20px;
}

.age-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  max-width:650px;
  margin:auto;
}

.age-card {
  background:white;
  border-radius:22px;
  padding:22px 12px;
  text-align:center;
  box-shadow:0 4px 12px rgba(0,0,0,.06);
  border:2px solid transparent;
  cursor:pointer;
  transition:.2s;
}

.age-card:nth-child(odd) { border-color:var(--blue-light); }
.age-card:nth-child(even) { border-color:var(--orange-light); }

.age-icon { font-size:60px; margin-bottom:8px; }
.age-card h2 { font-size:21px; margin:5px 0; }

.back-button {
  border:none;
  background:var(--blue-light);
  color:var(--blue-dark);
  padding:10px 18px;
  border-radius:20px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:15px;
}

.products-heading {
  text-align:center;
  margin:5px 0 15px;
}

.products-heading h1 { margin:5px 0; font-size:25px; }

.products-heading p {
  color:var(--muted);
  font-size:14px;
  margin:5px 0 15px;
}

.age-tabs {
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.age-tabs button {
  border:none;
  background:white;
  color:var(--text);
  padding:10px 15px;
  border-radius:20px;
  font-size:14px;
  cursor:pointer;
}

.age-tabs button.active {
  background:var(--blue);
  color:white;
  font-weight:bold;
}

.age-tabs button:nth-child(even).active { background:var(--orange); }

.stage-title {
  text-align:center;
  margin:10px 0 5px;
  font-size:23px;
}

.stage-desc {
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin:5px 0 18px;
}

.product-list {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  max-width:800px;
  margin:auto;
}

.product-card {
  background:white;
  border-radius:18px;
  padding:20px 12px;
  text-align:center;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
  cursor:pointer;
}

.product-icon { font-size:48px; margin-bottom:8px; }
.product-card h3 { margin:5px 0; font-size:18px; }

.product-card p {
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin:8px 0;
}

.product-label {
  display:inline-block;
  background:var(--blue-light);
  color:var(--blue-dark);
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  margin-top:5px;
}

/* 搖搖馬專區 */
.feature-heading {
  text-align:center;
  margin:10px 0 25px;
}

.feature-heading .big-icon { font-size:75px; }
.feature-heading h1 { margin:8px 0; font-size:26px; }

.feature-heading p {
  color:var(--muted);
  font-size:14px;
}

.feature-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  max-width:650px;
  margin:auto;
}

.feature-card {
  background:white;
  border-radius:22px;
  padding:28px 12px;
  text-align:center;
  cursor:pointer;
  border:2px solid var(--blue-light);
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}

.feature-card:nth-child(even) { border-color:var(--orange-light); }
.feature-icon { font-size:55px; }
.feature-card h2 { font-size:20px; margin:12px 0 5px; }

.feature-card p {
  color:var(--muted);
  font-size:13px;
}

/* 兒歌 */
.content-title {
  text-align:center;
  font-size:24px;
  margin:10px 0 20px;
}

.song-list {
  max-width:650px;
  margin:auto;
}

.song-card {
  background:white;
  padding:17px;
  border-radius:16px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.song-info { display:flex; align-items:center; gap:13px; }
.song-icon { font-size:35px; }
.song-info h3 { margin:0 0 5px; font-size:17px; }

.song-info p {
  margin:0;
  color:var(--muted);
  font-size:12px;
}

.song-button {
  border:none;
  background:var(--blue-light);
  color:var(--blue-dark);
  padding:10px 14px;
  border-radius:20px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}

/* 繪本列表 */
.book-list {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  max-width:700px;
  margin:auto;
}

.book-card {
  background:white;
  border-radius:18px;
  padding:15px 12px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}

.book-cover {
  height:130px;
  border-radius:14px;
  background:var(--blue-light);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  margin-bottom:12px;
}

.book-card:nth-child(even) .book-cover { background:var(--orange-light); }
.book-card h3 { margin:5px 0; font-size:17px; }

.book-card p {
  color:var(--muted);
  font-size:12px;
}

/* 故事閱讀 */
.story-container {
  max-width:600px;
  margin:auto;
  background:white;
  border-radius:22px;
  padding:20px;
  text-align:center;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}

.story-picture {
  background:var(--blue-light);
  border-radius:18px;
  padding:30px 10px;
  font-size:85px;
  margin-bottom:18px;
}

.story-container h2 { font-size:23px; }

.story-text {
  font-size:17px;
  line-height:2;
  min-height:110px;
  text-align:left;
  white-space:pre-line;
}

.story-controls {
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:18px;
}

.story-controls button {
  border:none;
  background:var(--blue);
  color:white;
  padding:12px 18px;
  border-radius:25px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.story-controls button:last-child { background:var(--orange); }

.story-page-number {
  color:var(--muted);
  font-size:13px;
  margin-top:15px;
}

/* 語音控制 */
.audio-controls {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid #edf1f4;
}

.audio-controls button {
  border:none;
  border-radius:22px;
  padding:12px 17px;
  background:var(--blue-light);
  color:var(--blue-dark);
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.audio-controls .play-button {
  background:var(--orange);
  color:white;
}

.audio-status {
  color:var(--muted);
  font-size:13px;
  margin-top:12px;
  min-height:20px;
}

button:disabled {
  opacity:.4;
  cursor:not-allowed;
}

@media(max-width:480px) {
  .page { padding:15px; }
  .age-grid,.feature-grid { gap:12px; }
  .age-card { padding:20px 8px; }
  .age-icon { font-size:50px; }
  .age-card h2 { font-size:18px; }
  .product-list,.book-list { gap:10px; }
  .product-card { padding:16px 8px; }
  .book-cover { height:105px; font-size:55px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">REGO</div>
  <div class="tagline">一件產品，陪伴一生</div>
</header>

<!-- 首頁 -->
<section id="home" class="page active">
  <div class="home-title">選擇你的年齡階段</div>

  <div class="age-grid">
    <div class="age-card" onclick="openAge('child')">
      <div class="age-icon">🧸</div>
      <h2>兒童</h2>
    </div>

    <div class="age-card" onclick="openAge('youth')">
      <div class="age-icon">🚲</div>
      <h2>青年</h2>
    </div>

    <div class="age-card" onclick="openAge('adult')">
      <div class="age-icon">🛒</div>
      <h2>壯年</h2>
    </div>

    <div class="age-card" onclick="openAge('senior')">
      <div class="age-icon">🚶</div>
      <h2>老年</h2>
    </div>
  </div>
</section>

<!-- 產品頁 -->
<section id="products" class="page">
  <button class="back-button" onclick="showPage('home')">← 返回首頁</button>

  <div class="products-heading">
    <h1>REGO 產品介紹</h1>
    <p>依照不同年齡階段，提供適合的生活產品</p>
  </div>

  <div class="age-tabs">
    <button id="tab-child" onclick="openAge('child')">兒童</button>
    <button id="tab-youth" onclick="openAge('youth')">青年</button>
    <button id="tab-adult" onclick="openAge('adult')">壯年</button>
    <button id="tab-senior" onclick="openAge('senior')">老年</button>
  </div>

  <h2 class="stage-title" id="stageTitle"></h2>
  <p class="stage-desc" id="stageDesc"></p>
  <div class="product-list" id="productList"></div>
</section>

<!-- 搖搖馬專區 -->
<section id="rocking" class="page">
  <button class="back-button" onclick="showPage('products')">← 返回兒童產品</button>

  <div class="feature-heading">
    <div class="big-icon">🧸</div>
    <h1>搖搖馬互動專區</h1>
    <p>一起聽兒歌、讀故事，享受快樂時光！</p>
  </div>

  <div class="feature-grid">
    <div class="feature-card" onclick="showPage('songs')">
      <div class="feature-icon">🎵</div>
      <h2>兒歌天地</h2>
      <p>一起聽歌、唱歌、動動身體</p>
    </div>

    <div class="feature-card" onclick="showPage('books')">
      <div class="feature-icon">📚</div>
      <h2>故事繪本</h2>
      <p>看故事，也可以聽故事</p>
    </div>
  </div>
</section>

<!-- 兒歌頁 -->
<section id="songs" class="page">
  <button class="back-button" onclick="showPage('rocking')">← 返回搖搖馬</button>
  <h1 class="content-title">🎵 兒歌天地</h1>

  <div class="song-list">
    <div class="song-card">
      <div class="song-info">
        <div class="song-icon">⭐</div>
        <div><h3>小星星</h3><p>經典童謠</p></div>
      </div>
      <button class="song-button" onclick="searchSong('小星星 兒歌')">聽兒歌</button>
    </div>

    <div class="song-card">
      <div class="song-info">
        <div class="song-icon">🐯</div>
        <div><h3>兩隻老虎</h3><p>經典童謠</p></div>
      </div>
      <button class="song-button" onclick="searchSong('兩隻老虎 兒歌')">聽兒歌</button>
    </div>

    <div class="song-card">
      <div class="song-info">
        <div class="song-icon">🥕</div>
        <div><h3>拔蘿蔔</h3><p>趣味童謠</p></div>
      </div>
      <button class="song-button" onclick="searchSong('拔蘿蔔 兒歌')">聽兒歌</button>
    </div>

    <div class="song-card">
      <div class="song-info">
        <div class="song-icon">🚌</div>
        <div><h3>公車來了</h3><p>生活主題兒歌</p></div>
      </div>
      <button class="song-button" onclick="searchSong('公車 兒歌')">聽兒歌</button>
    </div>
  </div>
</section>

<!-- 繪本列表 -->
<section id="books" class="page">
  <button class="back-button" onclick="stopStory();showPage('rocking')">← 返回搖搖馬</button>
  <h1 class="content-title">📚 故事繪本</h1>

  <div class="book-list" id="bookList"></div>
</section>

<!-- 故事閱讀頁 -->
<section id="story" class="page">
  <button class="back-button" onclick="stopStory();showPage('books')">← 返回繪本列表</button>

  <div class="story-container">
    <div class="story-picture" id="storyPicture">🐰</div>
    <h2 id="storyTitle"></h2>
    <div class="story-text" id="storyText"></div>

    <div class="story-controls">
      <button id="prevPage" onclick="changeStoryPage(-1)">上一頁</button>
      <button id="nextPage" onclick="changeStoryPage(1)">下一頁</button>
    </div>

    <div class="story-page-number" id="storyPageNumber"></div>

    <div class="audio-controls">
      <button class="play-button" onclick="playStory()">▶ 播放故事</button>
      <button onclick="pauseStory()">⏸ 暫停</button>
      <button onclick="resumeStory()">▶ 繼續</button>
      <button onclick="stopStory()">■ 停止</button>
    </div>

    <div class="audio-status" id="audioStatus">按下播放故事，就可以開始聆聽囉！</div>
  </div>
</section>

<script>
const products = {
  child: {
    title:"兒童階段",
    desc:"陪伴孩子探索世界，從遊戲中培養平衡與活動能力。",
    items:[
      {icon:"🧸",name:"搖搖馬",desc:"透過前後搖動，享受遊戲樂趣。",action:"rocking"},
      {icon:"🛴",name:"滑步車",desc:"幫助孩子練習平衡，探索移動的樂趣。"},
      {icon:"🚗",name:"兒童拖車",desc:"提供不同的遊戲與移動使用方式。"}
    ]
  },
  youth: {
    title:"青年階段",
    desc:"滿足日常移動與活動需求，讓生活更加便利。",
    items:[
      {icon:"🚲",name:"腳踏車",desc:"適合日常通勤與戶外活動。"},
      {icon:"🛴",name:"滑板車",desc:"輕巧方便，適合短距離移動。"}
    ]
  },
  adult: {
    title:"壯年階段",
    desc:"配合日常生活需求，讓移動與收納更加方便。",
    items:[
      {icon:"🛒",name:"折疊推車",desc:"方便搬運物品，也能節省收納空間。"}
    ]
  },
  senior: {
    title:"老年階段",
    desc:"提供生活上的輔助，讓日常活動更加便利。",
    items:[
      {icon:"🛒",name:"買菜車",desc:"方便外出購物與攜帶日常用品。"},
      {icon:"🚶",name:"助行器",desc:"提供行走時的支撐與輔助。"}
    ]
  }
};

/* 故事資料：6 本原創繪本 */
const stories = {
  forest: {
    title:"小兔子的森林冒險",
    cover:"🐰",
    description:"小兔子第一次探索森林的故事",
    pages:[
      {picture:"🐰🌳",text:"在一座美麗的森林裡，住著一隻喜歡冒險的小兔子。一天早上，牠背起小背包，準備出門探索森林。"},
      {picture:"🐰🦋",text:"走著走著，小兔子遇見一隻漂亮的蝴蝶。蝴蝶說：「你好呀！要不要和我一起去看花海？」"},
      {picture:"🐰🌼",text:"牠們來到一片開滿花朵的草地。紅色、黃色、紫色的花朵，讓小兔子看得目不轉睛。"},
      {picture:"🐰🐿️",text:"這時，一隻小松鼠跑了過來。牠們一起分享點心，還玩了好多有趣的遊戲。"},
      {picture:"🌈🐰",text:"回家的路上，天空出現了一道彩虹。小兔子開心地想著，今天真是充滿驚喜的一天！"}
    ]
  },

  star: {
    title:"找星星的小熊",
    cover:"⭐",
    description:"一場溫暖的星空小旅行",
    pages:[
      {picture:"🐻🌙",text:"夜晚到了，小熊坐在窗邊，看著天空中的星星。牠最喜歡數星星，今天卻發現少了一顆。"},
      {picture:"🐻🔦",text:"小熊帶著小燈出門，決定找找那顆不見的星星。牠走過草地，遇見了小狐狸。"},
      {picture:"🦊🐻",text:"小狐狸問：「你在找什麼呀？」小熊說：「我在找一顆星星！」小狐狸便陪牠一起尋找。"},
      {picture:"☁️⭐",text:"牠們抬頭一看，原來星星被雲朵遮住了。微風吹過，雲朵慢慢散開，星星又出現了。"},
      {picture:"🐻❤️",text:"小熊開心地笑了。牠發現，有朋友陪伴的夜晚，就像星星一樣閃閃發亮。"}

  },

  ocean: {

      {picture:"🐠🐢",text:"有一天，小魚遇見一隻海龜。海龜說：「我知道一個很漂亮的珊瑚花園！」"},
      {picture:"🪸🐟",text:"珊瑚花園裡有好多不同顏色的珊瑚，還有許多小魚在裡面快樂地游來游去。"},
      {picture:"🐙🐠",text:"小魚又遇見了章魚朋友。章魚揮揮觸手，邀請小魚一起玩捉迷藏。"},
      {picture:"🐠💙",text:"太陽慢慢下山，小魚向新朋友道別。牠期待明天還能有更多有趣的海洋冒險。"}

  },

  dinosaur: {
    title:"恐龍小小探險家",

    description:"和小恐龍一起認識世界",

      {picture:"🦕🥚",text:"一天，小恐龍在草叢裡發現了一顆蛋。牠好奇地靠近，想知道裡面住著誰。"},
      {picture:"🐣🦕",text:"突然，蛋殼慢慢裂開，一隻小恐龍探出頭來。原來牠遇見了一位新朋友！"},

      {picture:"🦕❤️",text:"天黑了，牠們一起回到森林裡休息。從此以後，牠們成為最好的探險夥伴。"}

  },

  seed: {
    title:"小種子的願望",
    cover:"🌱",
    description:"看看一顆種子如何慢慢長大",
    pages:[
      {picture:"🌰🌱",text:"泥土裡住著一顆小種子。牠每天都在想：「我什麼時候才能看看外面的世界呢？」"},
      {picture:"🌧️🌰",text:"有一天，下了一場溫柔的雨。雨水流進泥土裡，小種子喝得飽飽的。"},

function showPage(id) {
  stopSpeechOnly();

  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

function openAge(age) {
  const data = products[age];

  document.getElementById("stageTitle").textContent = data.title;
  document.getElementById("stageDesc").textContent = data.desc;

  document.querySelectorAll(".age-tabs button").forEach(button => {
    button.classList.remove("active");
  });

  document.getElementById("tab-" + age).classList.add("active");

  const list = document.getElementById("productList");
  list.innerHTML = "";

  data.items.forEach(item => {
    const card = document.createElement("div");
    card.className = "product-card";

    const icon = document.createElement("div");
    icon.className = "product-icon";
    icon.textContent = item.icon;

    const name = document.createElement("h3");
    name.textContent = item.name;

    const desc = document.createElement("p");
    desc.textContent = item.desc;

    const label = document.createElement("span");
    label.className = "product-label";
    label.textContent = "REGO 全齡產品";

    card.append(icon,name,desc,label);

    if(item.action) {
      card.onclick = () => showPage(item.action);
    }

    list.appendChild(card);
  });

  showPage("products");
}

function searchSong(song) {
  const url = "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(song + " 兒歌");
  window.open(url,"_blank");
}

/* 建立繪本卡片 */
function renderBooks() {
  const list = document.getElementById("bookList");
  list.innerHTML = "";

  Object.entries(stories).forEach(([key,story]) => {
    const card = document.createElement("div");
    card.className = "book-card";

    const cover = document.createElement("div");
    cover.className = "book-cover";
    cover.textContent = story.cover;

    const title = document.createElement("h3");
    title.textContent = story.title;

    const desc = document.createElement("p");
    desc.textContent = story.description;

    card.append(cover,title,desc);
    card.onclick = () => openStory(key);

    list.appendChild(card);
  });
}

let currentStory = "";
let currentStoryPage = 0;
let speechItems = [];
let speechIndex = 0;
let speechMode = "stopped";

function openStory(name) {
  stopSpeechOnly();
  currentStory = name;
  currentStoryPage = 0;
  showStoryContent();
  showPage("story");
}

function showStoryContent() {
  const story = stories[currentStory];
  const page = story.pages[currentStoryPage];

  document.getElementById("storyTitle").textContent = story.title;
  document.getElementById("storyPicture").textContent = page.picture;
  document.getElementById("storyText").textContent = page.text;

  document.getElementById("storyPageNumber").textContent =
    "第 " + (currentStoryPage + 1) + " / " + story.pages.length + " 頁";

  document.getElementById("prevPage").disabled = currentStoryPage === 0;
  document.getElementById("nextPage").disabled =
    currentStoryPage === story.pages.length - 1;
}

function changeStoryPage(direction) {
  stopSpeechOnly();

  const story = stories[currentStory];
  currentStoryPage += direction;

  currentStoryPage = Math.max(
    0,
    Math.min(currentStoryPage,story.pages.length - 1)
  );

  showStoryContent();
  setAudioStatus("已切換故事頁面，按播放即可繼續聆聽。");
}

function setAudioStatus(message) {
  document.getElementById("audioStatus").textContent = message;
}

function getChineseVoice() {
  const voices = speechSynthesis.getVoices();

  return voices.find(v => v.lang === "zh-TW") ||
         voices.find(v => v.lang.startsWith("zh")) ||
         null;
}

function playStory() {
  if(!("speechSynthesis" in window)) {
    setAudioStatus("目前瀏覽器不支援語音朗讀，請改用其他瀏覽器。");
    return;
  }

  stopSpeechOnly();

  const story = stories[currentStory];
  speechItems = story.pages.map(page => page.text);
  speechIndex = currentStoryPage;
  speechMode = "playing";

  speakCurrentPage();
}

function speakCurrentPage() {
  if(speechMode !== "playing") return;

  if(speechIndex >= speechItems.length) {
    speechMode = "stopped";
    setAudioStatus("故事播放完成！謝謝你的聆聽。");
    return;
  }

  currentStoryPage = speechIndex;
  showStoryContent();

  const utterance = new SpeechSynthesisUtterance(
    speechItems[speechIndex]
  );

  const voice = getChineseVoice();

  if(voice) utterance.voice = voice;

  utterance.lang = voice ? voice.lang : "zh-TW";
  utterance.rate = 0.9;
  utterance.pitch = 1.05;

  utterance.onend = () => {
    if(speechMode !== "playing") return;

    speechIndex++;

    if(speechIndex < speechItems.length) {
      speakCurrentPage();
    } else {
      speechMode = "stopped";
      setAudioStatus("故事播放完成！謝謝你的聆聽。");
    }
  };

  utterance.onerror = () => {
    if(speechMode === "playing") {
      speechMode = "stopped";
      setAudioStatus("語音播放遇到問題，請再試一次。");
    }
  };

  setAudioStatus("正在朗讀故事……");
  speechSynthesis.speak(utterance);
}

function pauseStory() {
  if(!("speechSynthesis" in window)) return;

  if(speechSynthesis.speaking && !speechSynthesis.paused) {
    speechSynthesis.pause();
    speechMode = "paused";
    setAudioStatus("故事已暫停。");
  }
}

function resumeStory() {
  if(!("speechSynthesis" in window)) return;

  if(speechSynthesis.paused) {
    speechSynthesis.resume();
    speechMode = "playing";
    setAudioStatus("繼續播放故事……");
  } else if(speechMode === "stopped") {
    playStory();
  }
}

function stopSpeechOnly() {
  if("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  speechMode = "stopped";
}

function stopStory() {
  stopSpeechOnly();
  setAudioStatus("故事已停止。");
}

/* 載入繪本 */
renderBooks();
</script>
